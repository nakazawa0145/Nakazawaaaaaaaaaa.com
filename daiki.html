<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaikiLinkTool</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: "Courier New", Consolas, monospace;
    background: #000;
    color: #0f0;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #0a0a0a;
    border-radius: 10px;
    padding: 20px;
    border: 1px solid #1f1f1f;
    box-shadow: 0 0 20px rgba(0,255,0,0.08);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
    color: #ff0000;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,0,0,0.6);
  }
  .sub {
    text-align: center;
    font-size: 11px;
    color: #0f0;
    opacity: 0.6;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #ff3333;
    margin: 14px 0 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: "Courier New", Consolas, monospace;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    background: #050505;
    color: #0f0;
  }
  input:focus {
    outline: none;
    border-color: #ff0000;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > div {
    flex: 1;
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  button {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: "Courier New", Consolas, monospace;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #startBtn {
    background: #061a06;
    color: #0f0;
    border: 1px solid #0f0;
  }
  #startBtn:disabled {
    background: #0a0a0a;
    color: #1a3a1a;
    border-color: #1a3a1a;
  }
  #stopBtn {
    background: #1a0505;
    color: #ff3333;
    border: 1px solid #ff3333;
  }
  .status {
    margin-top: 20px;
    text-align: center;
  }
  .status .count {
    font-size: 40px;
    font-weight: 700;
    color: #ff0000;
    text-shadow: 0 0 10px rgba(255,0,0,0.5);
  }
  .status .label {
    font-size: 12px;
    color: #0f0;
    opacity: 0.7;
  }
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    border-top: 1px solid #1f1f1f;
    padding-top: 10px;
  }
  .log-header span {
    font-size: 12px;
    color: #0f0;
    opacity: 0.7;
  }
  #fullscreenLogBtn {
    background: #0a0a0a;
    color: #0f0;
    border: 1px solid #0f0;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: "Courier New", Consolas, monospace;
  }
  .log {
    margin-top: 10px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
    color: #0f0;
  }
  .log div {
    padding: 4px 0;
    border-bottom: 1px dashed #1a1a1a;
  }
  .warn {
    margin-top: 16px;
    font-size: 11px;
    color: #ff6666;
    background: #140505;
    border: 1px solid #3a0a0a;
    padding: 10px 12px;
    border-radius: 6px;
    line-height: 1.5;
  }

  /* 全画面ログ */
  #fullscreenLog {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    color: #0f0;
    z-index: 9999;
    padding: 24px 16px;
    overflow-y: auto;
    font-family: "Courier New", Consolas, monospace;
  }
  #fullscreenLog.active {
    display: block;
  }
  #fullscreenLog .fs-title {
    color: #ff0000;
    font-size: 16px;
    text-align: center;
    margin-bottom: 4px;
    text-shadow: 0 0 8px rgba(255,0,0,0.6);
  }
  #fullscreenLog .fs-hint {
    color: #0f0;
    opacity: 0.5;
    font-size: 11px;
    text-align: center;
    margin-bottom: 16px;
  }
  #fullscreenLog .fs-entry {
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px dashed #1a1a1a;
  }
</style>
</head>
<body>

<div class="card">
  <h1>DaikiLinkTool</h1>
  <div class="sub">// auto link opener</div>

  <label for="url">開くURL</label>
  <input type="text" id="url" placeholder="https://example.com" value="https://example.com">

  <div class="row">
    <div>
      <label for="minSec">最短秒数</label>
      <input type="number" id="minSec" value="10" min="1">
    </div>
    <div>
      <label for="maxSec">最長秒数</label>
      <input type="number" id="maxSec" value="20" min="1">
    </div>
  </div>

  <div class="buttons">
    <button id="startBtn">開始</button>
    <button id="stopBtn">停止</button>
  </div>

  <div class="status">
    <div class="count" id="countDisplay">--</div>
    <div class="label" id="statusLabel">停止中</div>
  </div>

  <div class="log-header">
    <span>LOG</span>
    <button id="fullscreenLogBtn">全画面ログ</button>
  </div>
  <div class="log" id="log"></div>

  <div class="warn">
    ※ スマホのブラウザは自動的なタブ・ポップアップ表示をブロックすることがあります。
    ブロックされた場合はアドレスバー付近に出るポップアップ許可の通知から「許可」を選んでください。
    (Safariでは自動タブ表示がブロックされやすいので、Chromeの使用を推奨します)
  </div>
</div>

<div id="fullscreenLog">
  <div class="fs-title">DaikiLinkTool LOG</div>
  <div class="fs-hint">画面をタップすると閉じます</div>
  <div id="fsLogList"></div>
</div>

<script>
let timerId = null;
let countdownId = null;
let remaining = 0;

const urlInput = document.getElementById('url');
const minInput = document.getElementById('minSec');
const maxInput = document.getElementById('maxSec');
const countDisplay = document.getElementById('countDisplay');
const statusLabel = document.getElementById('statusLabel');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const logEl = document.getElementById('log');
const fullscreenLog = document.getElementById('fullscreenLog');
const fsLogList = document.getElementById('fsLogList');
const fullscreenLogBtn = document.getElementById('fullscreenLogBtn');

function randomSeconds(min, max) {
  min = Math.max(1, Math.floor(min));
  max = Math.max(min, Math.floor(max));
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function addLog(text) {
  const now = new Date();
  const t = now.toLocaleTimeString('ja-JP');
  const entryText = `[${t}] ${text}`;

  const div = document.createElement('div');
  div.textContent = entryText;
  logEl.prepend(div);

  const fsDiv = document.createElement('div');
  fsDiv.className = 'fs-entry';
  fsDiv.textContent = entryText;
  fsLogList.prepend(fsDiv);
}

function scheduleNext() {
  const min = parseInt(minInput.value, 10) || 10;
  const max = parseInt(maxInput.value, 10) || 20;
  remaining = randomSeconds(min, max);
  countDisplay.textContent = remaining;
  statusLabel.textContent = '次のオープンまで';

  clearInterval(countdownId);
  countdownId = setInterval(() => {
    remaining -= 1;
    if (remaining >= 0) {
      countDisplay.textContent = remaining;
    }
  }, 1000);

  timerId = setTimeout(() => {
    const url = urlInput.value.trim();
    if (url) {
      window.open(url, '_blank');
      addLog(`開きました: ${url}`);
    }
    scheduleNext();
  }, remaining * 1000);
}

startBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (!url) {
    alert('URLを入力してください');
    return;
  }
  startBtn.disabled = true;
  urlInput.disabled = true;
  minInput.disabled = true;
  maxInput.disabled = true;
  addLog('開始しました');
  scheduleNext();
});

stopBtn.addEventListener('click', () => {
  clearTimeout(timerId);
  clearInterval(countdownId);
  startBtn.disabled = false;
  urlInput.disabled = false;
  minInput.disabled = false;
  maxInput.disabled = false;
  countDisplay.textContent = '--';
  statusLabel.textContent = '停止中';
  addLog('停止しました');
});

fullscreenLogBtn.addEventListener('click', () => {
  fullscreenLog.classList.add('active');
});

fullscreenLog.addEventListener('click', () => {
  fullscreenLog.classList.remove('active');
});
</script>

</body>
</html>
